<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trädgårdskarta</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 40px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f2f4ee;
      color: #1f2a1f;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 {
      margin: 0;
      font-size: 1.7rem;
      color: #2f5d34;
    }
    header p {
      margin: 6px 0 0;
      color: #5b665b;
      font-size: 0.95rem;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Verktygsrad */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      padding: 12px 18px;
      margin-bottom: 16px;
    }
    .tool-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tool-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #5b665b;
    }

    .btn {
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 8px;
      border: 2px solid #2f5d34;
      background: #2f5d34;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #3d7543; }

    /* Färgval */
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #c9cfc4;
      cursor: pointer;
      padding: 0;
    }
    .swatch.active {
      box-shadow: 0 0 0 3px #1f2a1f;
    }
    .custom-color {
      width: 32px;
      height: 30px;
      border: none;
      padding: 0;
      background: none;
      cursor: pointer;
    }

    /* Tjocklek */
    input[type=range] { width: 130px; accent-color: #2f5d34; }
    .size-preview {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .size-dot { border-radius: 50%; }

    /* Kartyta */
    .stage {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      padding: 16px;
    }

    .dropzone {
      border: 3px dashed #b7c4b0;
      border-radius: 12px;
      padding: 70px 20px;
      text-align: center;
      color: #5b665b;
      transition: background 0.2s, border-color 0.2s;
    }
    .dropzone.over {
      background: #eef5ea;
      border-color: #2f5d34;
    }
    .dropzone h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
      color: #2f5d34;
    }
    .dropzone p { margin: 0 0 18px; }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      cursor: crosshair;
      border-radius: 6px;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Trädgårdskarta</h1>
    <p>Ladda upp en karta och markera var växterna finns.</p>
  </header>

  <div class="toolbar" id="toolbar" hidden>
    <div class="tool-group">
      <button class="btn" id="changeMapBtn">Byt karta</button>
    </div>

    <div class="tool-group">
      <span class="tool-label">Färg</span>
      <div class="tool-group" id="swatches"></div>
      <input type="color" class="custom-color" id="customColor" title="Välj egen färg" />
    </div>

    <div class="tool-group">
      <span class="tool-label">Tjocklek</span>
      <input type="range" id="sizeSlider" min="2" max="40" value="8" />
      <div class="size-preview"><div class="size-dot" id="sizeDot"></div></div>
    </div>
  </div>

  <div class="stage">
    <div class="dropzone" id="dropzone">
      <h2>Ladda upp en karta</h2>
      <p>Dra in en bild hit, eller klicka på knappen.</p>
      <button class="btn" id="uploadBtn">Välj bild</button>
    </div>
    <canvas id="canvas" hidden></canvas>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden />
</div>

<script>
  // ─── Tillstånd ────────────────────────────────────────────────────────────
  // Varje markering sparas som ett eget "drag" (färg, tjocklek, punkter).
  // Koordinaterna är i kartbildens egna pixlar, så markeringarna hamnar rätt
  // oavsett hur stor kartan visas på skärmen.
  const state = {
    img: null,
    strokes: [],
    color: '#2e7d32',
    size: 8
  };

  const COLORS = ['#2e7d32', '#8bc34a', '#f9a825', '#e65100', '#c62828', '#ad1457', '#6a1b9a', '#1565c0', '#6d4c41', '#ffffff'];

  const canvas     = document.getElementById('canvas');
  const ctx        = canvas.getContext('2d');
  const dropzone   = document.getElementById('dropzone');
  const toolbar    = document.getElementById('toolbar');
  const fileInput  = document.getElementById('fileInput');
  const swatchesEl = document.getElementById('swatches');
  const customColor = document.getElementById('customColor');
  const sizeSlider = document.getElementById('sizeSlider');
  const sizeDot    = document.getElementById('sizeDot');

  // ─── Ladda upp karta ──────────────────────────────────────────────────────
  document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
  document.getElementById('changeMapBtn').addEventListener('click', () => {
    if (state.strokes.length && !confirm('Om du byter karta försvinner dina markeringar. Vill du fortsätta?')) return;
    fileInput.click();
  });
  fileInput.addEventListener('change', () => {
    loadImage(fileInput.files[0]);
    fileInput.value = '';
  });

  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('over');
    loadImage(e.dataTransfer.files[0]);
  });

  function loadImage(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert('Välj en bildfil, till exempel .jpg eller .png.');
      return;
    }
    const img = new Image();
    img.onload = () => {
      state.img = img;
      state.strokes = [];
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      dropzone.hidden = true;
      canvas.hidden = false;
      toolbar.hidden = false;
      redraw();
    };
    img.src = URL.createObjectURL(file);
  }

  // ─── Färg och tjocklek ────────────────────────────────────────────────────
  COLORS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.style.background = c;
    b.title = c;
    b.addEventListener('click', () => setColor(c));
    swatchesEl.appendChild(b);
  });
  customColor.addEventListener('input', () => setColor(customColor.value));
  sizeSlider.addEventListener('input', () => { state.size = +sizeSlider.value; updatePreview(); });

  function setColor(c) {
    state.color = c;
    customColor.value = c;
    swatchesEl.querySelectorAll('.swatch').forEach(s => {
      s.classList.toggle('active', s.title === c);
    });
    updatePreview();
  }

  function updatePreview() {
    sizeDot.style.width = state.size + 'px';
    sizeDot.style.height = state.size + 'px';
    sizeDot.style.background = state.color;
    sizeDot.style.boxShadow = state.color.toLowerCase() === '#ffffff' ? '0 0 0 1px #c9cfc4' : 'none';
  }

  setColor(state.color);

  // ─── Rita med vänster musknapp ────────────────────────────────────────────
  let current = null;

  // Omräkning från skärmposition till kartbildens pixlar
  function toMap(e) {
    const r = canvas.getBoundingClientRect();
    const s = canvas.width / r.width;
    return { x: (e.clientX - r.left) * s, y: (e.clientY - r.top) * s };
  }

  canvas.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const scale = canvas.width / canvas.getBoundingClientRect().width;
    current = { color: state.color, width: state.size * scale, points: [toMap(e)] };
    state.strokes.push(current);
    drawStroke(current);
  });

  window.addEventListener('mousemove', e => {
    if (!current) return;
    const p = toMap(e);
    const last = current.points[current.points.length - 1];
    current.points.push(p);
    applyStyle(current);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });

  window.addEventListener('mouseup', () => { current = null; });

  function applyStyle(s) {
    ctx.strokeStyle = s.color;
    ctx.fillStyle = s.color;
    ctx.lineWidth = s.width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  function drawStroke(s) {
    applyStyle(s);
    if (s.points.length === 1) {
      const p = s.points[0];
      ctx.beginPath();
      ctx.arc(p.x, p.y, s.width / 2, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(s.points[0].x, s.points[0].y);
    for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
    ctx.stroke();
  }

  function redraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (state.img) ctx.drawImage(state.img, 0, 0);
    state.strokes.forEach(drawStroke);
  }
</script>
</body>
</html>
